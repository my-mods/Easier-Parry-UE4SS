; Easier Parry - UE4SS
;
; Shipped defaults. Updates may replace this reference file.
; Personal overrides: %LOCALAPPDATA%/Dawnwalker/Saved/Config/EasierParryUE4SS.ini
; Console commands save only to that personal file, never to these defaults.
; Death and save loading do not reload settings. Restart after direct INI edits.
;
; factor multiplies the live vanilla/difficulty-adjusted ParryWindowMultiplier.
;   1.0 = vanilla
;   2.0 = twice the parry window (default)
;   3.0 = three times the parry window
; Values below 1.0 make parrying harder. The safe accepted range is 0.1 to 50.0.

[General]
enabled = true
factor = 2.0

; Check the cached attribute once per second; write only if its value changes.
; Follow the current local player and attribute owner without global player searches.
; Applied when the script starts; restart the game after changing this setting.
pollMilliseconds = 1000

; true prints diagnostic/reapply information and bounded PERF timing summaries.
; Session controls: easierparry debug on | off | status. Default remains false.
; The normal one-time "Loaded" and "Applied" confirmations are always logged.
debugLogging = false

; debugLogging also captures bounded guard/attack/dodge events, raw LT and input tags.
; Tracing stops at 2048 records; debug off/on starts a fresh capture.

; Guard recovery is handled by native game abilities and is always active.
; The old dodgeInterruptsGuard option is ignored; personal INIs are preserved.
; enabled controls only the parry timing multiplier.
