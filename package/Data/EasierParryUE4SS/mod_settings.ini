[Mod]
Id = oOCamilleOo_EasierParryAndDodgeWhileBlocking
Name = Easier Parry and Dodge While Blocking
Author = oOCamilleOo
Version = 1.2.3
AuthorURL = https://www.nexusmods.com/users/933214
Description = Change settings here. Apply, then load a save.

[Setting.enabled]
Id = enabled
Label = Parry timing adjustment
Group = General
Description = Native guard and dodge fixes remain active while installed. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.parryWindowPercent]
Id = parryWindowPercent
Label = Parry window
Group = Parry
Description = 100% is normal timing; 200% doubles the current difficulty-adjusted window. Choose from 20 percentages with closer spacing at low values and wider gaps at high values. Apply, then load a save.
Type = picker
PresetValues = 10|25|50|75|100|125|150|175|200|250|300|400|500|750|1000|1500|2000|3000|4000|5000
PresetLabels = 10%|25%|50%|75%|100%|125%|150%|175%|200%|250%|300%|400%|500%|750%|1000%|1500%|2000%|3000%|4000%|5000%
Default = 200
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = parryWindowPercent

[Category.Parry]
VisibleWhen = enabled
VisibleValues = 1

[Setting.debugLogging]
Id = debugLogging
Label = Logging
Group = Diagnostics
Description = Write troubleshooting details to UE4SS.log. Leave Off for normal play. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = debugLogging
