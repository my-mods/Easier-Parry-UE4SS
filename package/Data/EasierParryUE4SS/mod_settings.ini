[Mod]
Id = oOCamilleOo_EasierParryAndDodgeWhileBlocking
Name = Easier Parry and Dodge While Blocking
Author = oOCamilleOo
Version = 1.2.3
AuthorURL = https://www.nexusmods.com/users/933214
Description = Change settings here. Apply, then load a save.

[Setting.enabled]
Id = enabled
Label = Parry timing multiplier
Group = General
Description = Native guard and dodge fixes remain active while installed. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.factor]
Id = factor
Label = Parry window multiplier
Group = Parry
Description = 1 is vanilla timing; 2 doubles the current difficulty-adjusted window. Apply, then load a save.
Type = slider
Minimum = 0.1
Maximum = 50
Step = 0.1
Decimals = 2
Default = 2
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = factor

[Category.Parry]
VisibleWhen = enabled
VisibleValues = 1

[Setting.debugLogging]
Id = debugLogging
Label = Logging
Group = Diagnostics
Description = Write troubleshooting details to UE4SS.log. Leave Off for normal play. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = debugLogging
